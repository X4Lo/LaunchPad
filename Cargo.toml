[package]
name = "launchpad"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "A lightweight desktop application launcher"
build = "build.rs"

[dependencies]
# UI: native Rust toolkit, software renderer (no GPU context, no webview).
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
] }

tray-icon = { version = "0.26", default-features = false }
global-hotkey = "0.10"
auto-launch = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "bmp"] }
rfd = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
