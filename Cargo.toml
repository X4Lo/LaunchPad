[package]
name = "launchpad"
version = "0.1.0"
edition = "2021"
description = "A lightweight desktop application launcher"

[dependencies]
eframe = "0.31"
egui = "0.31"
tray-icon = "0.24"
global-hotkey = "0.8"
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
